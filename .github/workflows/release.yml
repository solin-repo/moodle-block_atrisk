name: Releasing in the Plugins directory

# Per FR-190. Triggered when a tag matching this branch's suffix is pushed
# (e.g. `v1.0.1-MOODLE_502_STABLE` on `main`). Calls the Moodle Plugins
# directory web service `local_plugins_add_version` directly (the canonical
# moodlehq/moodle-plugin-release approach) to publish the tagged version's
# GitHub zipball.
#
# Moodle-version compatibility is NOT set here: the directory reads
# $plugin->supported from version.php inside the fetched zipball. This branch
# ships supported=[501,502], so the release registers for Moodle 5.1 and 5.2.
# version, release name and maturity likewise default to version.php.
#
# Requires repo secret MOODLE_ORG_TOKEN — generate a long-lived token at the
# Moodle Plugins directory: log in at https://moodle.org/plugins/, then use the
# Navigation block > Plugins > API access page, for the `plugins_maintenance`
# service. (Do NOT use Preferences > Security keys / user/managetokens.php — those
# tokens expire quickly.) The token must belong to the moodle.org account that
# owns the plugin's directory entry.
#
# The Plugin Directory entry must already exist when this workflow first runs;
# the very first version is submitted manually at
# https://moodle.org/plugins/registerplugin.php (FR-193).

on:
  push:
    tags:
      - 'v*-MOODLE_502_STABLE'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to be released (e.g. v1.0.1-MOODLE_502_STABLE)'
        required: true

defaults:
  run:
    shell: bash

jobs:
  release-at-moodle-org:
    runs-on: ubuntu-latest

    env:
      PLUGIN: block_atrisk
      CURL: curl -s
      ENDPOINT: https://moodle.org/webservice/rest/server.php
      TOKEN: ${{ secrets.MOODLE_ORG_TOKEN }}
      FUNCTION: local_plugins_add_version

    steps:
      - name: Call the service function
        id: add-version
        run: |
          if [[ ! -z "${{ github.event.inputs.tag }}" ]]; then
            TAGNAME="${{ github.event.inputs.tag }}"
          elif [[ $GITHUB_REF = refs/tags/* ]]; then
            TAGNAME="${GITHUB_REF##*/}"
          fi
          if [[ -z "${TAGNAME}" ]]; then
            echo "No tag name has been provided!"
            exit 1
          fi
          ZIPURL="https://api.github.com/repos/${{ github.repository }}/zipball/${TAGNAME}"
          RESPONSE=$(${CURL} ${ENDPOINT} --data-urlencode "wstoken=${TOKEN}" \
                                         --data-urlencode "wsfunction=${FUNCTION}" \
                                         --data-urlencode "moodlewsrestformat=json" \
                                         --data-urlencode "frankenstyle=${PLUGIN}" \
                                         --data-urlencode "zipurl=${ZIPURL}" \
                                         --data-urlencode "vcssystem=git" \
                                         --data-urlencode "vcsrepositoryurl=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
                                         --data-urlencode "vcstag=${TAGNAME}" \
                                         --data-urlencode "changelogurl=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commits/${TAGNAME}" \
                                         --data-urlencode "altdownloadurl=${ZIPURL}")
          echo "response=${RESPONSE}" >> $GITHUB_OUTPUT

      - name: Evaluate the response
        id: evaluate-response
        env:
          RESPONSE: ${{ steps.add-version.outputs.response }}
        run: |
          jq <<< ${RESPONSE}
          jq --exit-status ".id" <<< ${RESPONSE} > /dev/null
